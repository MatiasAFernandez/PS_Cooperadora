[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cooperadora.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
