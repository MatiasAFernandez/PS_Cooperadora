name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cooperadora
          POSTGRES_USER: cooperadora
          POSTGRES_PASSWORD: cooperadora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cooperadora -d cooperadora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: cooperadora
      POSTGRES_USER: cooperadora
      POSTGRES_PASSWORD: cooperadora_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest
