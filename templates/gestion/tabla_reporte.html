{% load formato_ars %}
<div class="tbl-wrap">
  <table class="dense mob-cards">
    <thead>
      <tr><th scope="col">Grupo</th><th scope="col" class="cnt">Solicitudes</th><th scope="col" class="num">Solicitado · ARS</th><th scope="col" class="num">Facturado neto · ARS</th></tr>
    </thead>
    <tbody>
      {% for fila in filas %}
        <tr>
          <th scope="row">{{ fila.nombre }}</th>
          <td data-label="Solicitudes" class="cnt font-tabular"><span>{{ fila.cantidad }}</span></td>
          <td data-label="Solicitado · ARS" class="num font-tabular"><span>{{ fila.solicitado|ars }}</span></td>
          <td data-label="Facturado neto · ARS" class="num font-tabular"><span>{{ fila.neto|ars }}</span></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
