<section class="gestion-card"><h2>{{ titulo }}</h2><div class="gestion-table"><table><thead><tr><th>Grupo</th><th>Solicitudes</th><th>Solicitado · ARS</th><th>Facturado neto · ARS</th></tr></thead><tbody>{% for fila in filas %}<tr><th scope="row">{{ fila.nombre }}</th><td>{{ fila.cantidad }}</td><td>{{ fila.solicitado|floatformat:2 }}</td><td>{{ fila.neto|floatformat:2 }}</td></tr>{% empty %}<tr><td colspan="4">Sin actividad en el período seleccionado.</td></tr>{% endfor %}</tbody></table></div></section>
