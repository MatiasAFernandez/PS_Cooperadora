<div class="gestion-table">
  <table class="dense mob-cards">
    <thead>
      <tr><th scope="col">Grupo</th><th scope="col">Solicitudes</th><th scope="col">Solicitado · ARS</th><th scope="col">Facturado neto · ARS</th></tr>
    </thead>
    <tbody>
      {% for fila in filas %}
        <tr>
          <th scope="row">{{ fila.nombre }}</th>
          <td data-label="Solicitudes"><span>{{ fila.cantidad }}</span></td>
          <td data-label="Solicitado · ARS"><span>{{ fila.solicitado|floatformat:"2g" }}</span></td>
          <td data-label="Facturado neto · ARS"><span>{{ fila.neto|floatformat:"2g" }}</span></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
