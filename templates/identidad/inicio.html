<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sesión de demostración</title>
</head>
<body>
  <h1>Sesión de demostración activa</h1>
  <p>Sujeto local: {{ actor.subject_id }}</p>
  {% if "facturacion.consultar_propias" in actor.capabilities or "facturacion.consultar_todas" in actor.capabilities %}
  <p><a href="{% url 'facturacion:lista' %}">Consultar solicitudes de facturación</a></p>
  {% endif %}
  <form method="post" action="{% url 'identidad:logout' %}">
    {% csrf_token %}
    <button type="submit">Salir</button>
  </form>
</body>
</html>
