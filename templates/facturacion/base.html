<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Facturación — Cooperadora{% endblock %}</title>
<style>
body{font:1rem/1.5 system-ui,sans-serif;max-width:64rem;margin:2rem auto;padding:0 1rem;color:#172b3a}
nav{display:flex;gap:1rem;flex-wrap:wrap;border-bottom:1px solid #ccd5dd;padding-bottom:1rem}
a{color:#164fc4}label{display:block;font-weight:600}input,select,textarea,button{font:inherit;padding:.5rem;max-width:100%;box-sizing:border-box}
textarea{width:100%;min-height:6rem}p:has(label){margin:1.2rem 0}.errorlist{color:#9a1522}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccd5dd;padding:.7rem;text-align:left}
button{background:#164fc4;color:white;border:0;border-radius:.3rem;cursor:pointer}
.notice{background:#edf3fb;padding:1rem}dt{font-weight:600}dd{margin-bottom:1rem;overflow-wrap:anywhere}
:focus-visible{outline:3px solid #d78d00;outline-offset:2px}
</style></head><body>
<header><h1>Facturación — Cooperadora</h1>
{% include "comunes/navegacion_tramites.html" %}
<p><a href="{% url 'identidad:inicio' %}">Inicio de demo</a></p>
</header><main>{% block content %}{% endblock %}</main></body></html>
