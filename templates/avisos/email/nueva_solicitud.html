<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva solicitud de gasto #{{ numero }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: Arial, Helvetica, sans-serif; color: #444444; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; background-color: #f1f5f9; margin: 0; padding: 24px 12px;">
    <tr>
      <td align="center" style="padding: 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 620px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
          <tr>
            <td style="background-color: #090979; padding: 18px 24px; color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
              <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: #dbeafe;">
                UTN FRRe &middot; Cooperadora
              </p>
              <p style="margin: 4px 0 0 0; font-size: 16px; font-weight: 700; color: #ffffff;">
                PS_Cooperadora
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding: 24px; font-family: Arial, Helvetica, sans-serif;">
              <h1 style="margin: 0 0 18px 0; font-size: 20px; line-height: 1.3; font-weight: 700; color: #37423b;">
                Nueva solicitud de gasto #{{ numero }}
              </h1>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 22px;">
                <tr>
                  <td style="padding: 14px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; line-height: 1.4;">
                    <span style="display: block; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.3px;">
                      Número de solicitud
                    </span>
                    <span style="display: block; margin-top: 4px; font-size: 16px; font-weight: 700; color: #37423b;">
                      #{{ numero }}
                    </span>
                  </td>
                </tr>
                <tr>
                  <td style="padding: 14px 16px; font-size: 14px; line-height: 1.4;">
                    <span style="display: block; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.3px;">
                      Fecha de presentación
                    </span>
                    <span style="display: block; margin-top: 4px; font-size: 15px; font-weight: 700; color: #37423b;">
                      {{ fecha_presentacion }}
                    </span>
                  </td>
                </tr>
              </table>

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 20px 0;">
                <tr>
                  <td align="center" style="border-radius: 6px; background-color: #084298;">
                    <a href="{{ enlace_servidor }}" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 12px 22px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; color: #ffffff; text-decoration: none; border-radius: 6px;">
                      Ver solicitud
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #475569;">
                Si el botón no funciona, copiá y abrí este enlace en tu navegador:<br>
                <a href="{{ enlace_servidor }}" target="_blank" rel="noopener noreferrer" style="color: #084298; text-decoration: underline; word-break: break-all; overflow-wrap: anywhere;">{{ enlace_servidor }}</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
