<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PS Cooperadora{% endblock %}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; margin: 2rem auto; max-width: 800px; padding: 0 1rem; color: #212529; }
        header { border-bottom: 1px solid #dee2e6; margin-bottom: 2rem; padding-bottom: 1rem; }
        nav a { margin-right: 1rem; text-decoration: none; color: #0d6efd; font-weight: 500; }
        nav a:hover { text-decoration: underline; }
        .alert-error { color: #842029; background-color: #f8d7da; border: 1px solid #f5c2c7; padding: 0.75rem 1.25rem; margin-bottom: 1rem; border-radius: 4px; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-control { width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; }
        .btn { background: #0d6efd; color: white; padding: 0.5rem 1.25rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #0b5ed7; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #dee2e6; padding: 0.75rem; text-align: left; }
        th { background: #f8f9fa; }
        .badge { display: inline-block; padding: 0.25em 0.5em; font-size: 0.85em; font-weight: 600; border-radius: 4px; background: #e9ecef; }
        input, select, textarea, button { font: inherit; }
        input:not([type=hidden]):not([type=checkbox]):not([type=radio]), select, textarea { width:100%; padding:.5rem; border:1px solid #ced4da; border-radius:4px; box-sizing:border-box; }
        input[type=checkbox], input[type=radio] { width:auto; }
        textarea { min-height:6rem; }
        button { background:#0d6efd; color:white; padding:.5rem 1.25rem; border:0; border-radius:4px; cursor:pointer; }
        button:hover { background:#0b5ed7; }
        .nav-logout { background:transparent; color:#0d6efd; font-weight:500; padding:0; }
        .nav-logout:hover { background:transparent; text-decoration:underline; }
        .notice { background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px; padding:1rem; }
        .errorlist { color:#842029; }
        dt { font-weight:600; } dd { margin-bottom:1rem; overflow-wrap:anywhere; }
        :focus-visible { outline:3px solid #9b6800; outline-offset:2px; }
        li { overflow-wrap:anywhere; }
        .form-group small { display:block; }
        .filter-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 1.25rem; }
        .filter-wide { grid-column:1 / -1; }
        @media(max-width:600px) { .filter-fields { grid-template-columns:1fr; } }
        main { overflow-wrap:anywhere; }
        .panel { background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px; padding:1rem; margin:1.25rem 0; }
        .panel > h3:first-child { margin-top:0; }
        .record-list { list-style:none; padding:0; margin:1rem 0 0; }
        .record-card { background:white; border:1px solid #dee2e6; border-radius:4px; padding:1rem; margin-bottom:1rem; }
        .record-card > p { margin:0 0 .75rem; }
        .record-actions { display:flex; flex-wrap:wrap; align-items:stretch; gap:.75rem; margin-top:1rem; }
        .record-actions .btn { box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; text-align:center; line-height:1.4; max-width:100%; border:1px solid transparent; }
        .record-actions .btn-secondary { color:#084298; background:#fff; border-color:#9aafc9; }
        .record-actions .btn-secondary:hover { background:#e7f1ff; border-color:#084298; }
        .record-maintenance { margin-top:1rem; padding-top:1rem; border-top:1px solid #dee2e6; }
        .record-maintenance p { margin:0; color:#495057; }
        .history-list { padding-left:1.75rem; }
        .history-event { padding:1rem; margin-bottom:.75rem; border:1px solid #dee2e6; border-radius:4px; }
        .history-event p:last-child { margin-bottom:0; }
        .history-latest { background:#e7f1ff; border-left:4px solid #0d6efd; }
        .history-current { margin:0 0 .5rem; color:#084298; font-weight:700; }
        .history-expand > summary { cursor:pointer; color:#084298; background:#fff; border:1px solid #9aafc9; border-radius:4px; padding:.75rem 1rem; }
        .history-expand > summary:hover { background:#e7f1ff; }
        .history-hide, .history-expand[open] > summary .history-show { display:none; }
        .history-expand[open] > summary .history-hide { display:inline; }
        @media(max-width:600px) { .record-actions { flex-direction:column; } .record-actions .btn { width:100%; } }
        .detail-grid { display:grid; grid-template-columns:minmax(0,35%) minmax(0,65%); border-top:1px solid #dee2e6; border-left:1px solid #dee2e6; }
        .detail-grid dt, .detail-grid dd { margin:0; padding:.75rem; border-right:1px solid #dee2e6; border-bottom:1px solid #dee2e6; }
        .detail-grid dt { background:#f8f9fa; }
        @media(max-width:600px) { .detail-grid { grid-template-columns:1fr; } }

        table { font-size:.95rem; }

    </style>
</head>
<body>
    <header>
        <h2>{% block titulo_modulo %}PS Cooperadora — Circuito de Gastos{% endblock %}</h2>
        {% include "comunes/navegacion_tramites.html" %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
    document.querySelectorAll('.filter-fields').forEach(function(group) {
        const period = group.querySelector('[name="periodo"]');
        if (!period) return;
        function updatePeriod() {
            const active = {dia: ['dia'], mes: ['mes', 'anio'], anio: ['anio']}[period.value] || [];
            ['dia', 'mes', 'anio'].forEach(function(name) {
                const input = group.querySelector('[name="' + name + '"]');
                if (!input) return;
                input.disabled = !active.includes(name);
                input.closest('.form-group').hidden = input.disabled;
            });
        }
        period.addEventListener('change', updatePeriod);
        updatePeriod();
    });
    </script>
</body>
</html>
